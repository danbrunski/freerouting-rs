# DISABLED at Dan's request (2026-10-15): this file lives in docs/development/ so
# GitHub never runs it. To enable CI, move it to .github/workflows/ci.yml.
#
# The three gate commands below are the local gate (docs/development/engine.md,
# "Working practices"). Keep them identical to what a developer runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Provenance check
        if: runner.os == 'Linux'
        run: tools/check-provenance.sh
      - name: KiCad oracle unit tests (plain Python, no KiCad)
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/kicad-oracle/tests -p 'test_*.py'

  plugin-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest kicad-plugin/tests
