[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/danbrunski/freerouting-rs"
rust-version = "1.85"
authors = ["Dan Brunski"]
description = "PCB autorouter and viewer, a Rust port of Freerouting"

[workspace.dependencies]
freerouting-geometry = { path = "crates/freerouting-geometry" }
freerouting-dsn = { path = "crates/freerouting-dsn" }
freerouting-kicad = { path = "crates/freerouting-kicad" }
freerouting = { path = "crates/freerouting" }
freerouting-stages = { path = "crates/freerouting-stages" }

# Opt-level 1: `cargo test --workspace` warm takes 26 s instead of 181 s; overflow checks and debug assertions stay on.
[profile.dev]
opt-level = 1

# For profilers (docs/development/profiling.md): the release build with line tables, so callgrind
# and samply can name functions and lines. Same optimizer settings as release, so the code is the
# same code; only the debug info differs.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
