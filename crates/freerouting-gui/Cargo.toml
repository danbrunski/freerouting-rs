[package]
name = "freerouting-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "freerouting-gui"
path = "src/main.rs"

[dependencies]
freerouting.workspace = true
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence", "accesskit"] }
serde = { version = "1", features = ["derive"] }
png = "0.18"
# eframe's `wgpu` feature turns on no wgpu backend by itself; without these the app
# panics at startup with "No wgpu backend feature ... was enabled". GL (`gles`) is the
# fallback for machines and VMs without a working Vulkan/Metal/DX12 driver, WSLg included.
wgpu = { version = "25", default-features = false, features = ["dx12", "metal", "vulkan", "gles", "wgsl"] }
earcutr = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Same winit as eframe; used to pick X11 under WSL (see `window_system` in main.rs).
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
egui_kittest = { version = "=0.32.3", features = ["eframe", "wgpu", "snapshot"] }

# R01.5: the icon and version resource of the Windows exes (build.rs; only runs for msvc targets).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
